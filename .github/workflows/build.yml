name: Build Sikho AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p /tmp/sikho-project
          unzip -q SikhoAI-Android-Project.zip -d /tmp/sikho-project
          cp -R /tmp/sikho-project/app ./app
          cp /tmp/sikho-project/settings.gradle.kts .
          cp /tmp/sikho-project/build.gradle.kts .
          cp /tmp/sikho-project/gradle.properties .

      - name: Set Java and Kotlin target to 17
        run: |
          sed -i '/^android {/a\
              compileOptions {\
                  sourceCompatibility = JavaVersion.VERSION_17\
                  targetCompatibility = JavaVersion.VERSION_17\
              }\
              kotlinOptions {\
                  jvmTarget = "17"\
              }' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: SikhoAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
